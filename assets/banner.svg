<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#0d1b3e" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#326CE5" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Edge/IoT Accent -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Particle Filter -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 15px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Ambient animated background elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-18px) translateX(12px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(16px) translateX(-14px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -120; }
    }
    @keyframes helmSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .bg-pulse-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .bg-pulse-2 {
      animation: pulseGlow 9s ease-in-out infinite 2s;
      transform-origin: 1050px 240px;
    }
    .flow-line {
      stroke-dasharray: 8 14;
      animation: waveDash 10s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 6 12;
      animation: waveDash 14s linear infinite reverse;
    }
    .particle-1 { animation: floatParticle1 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle1 7s ease-in-out infinite 2.5s; }
  </style>

  <!-- Deep Tech Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Outer Card Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Background Pulsing Nebula / Aura -->
  <circle class="bg-pulse-1" cx="220" cy="120" r="160" fill="#326ce5" opacity="0.22" filter="url(#glow)" />
  <circle class="bg-pulse-2" cx="1020" cy="220" r="180" fill="#00d2ff" opacity="0.18" filter="url(#glow)" />
  <circle cx="600" cy="180" r="130" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- Constellation Flow Lines in Background (Behind Foreground Text) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 50,300 C 250,220 350,320 600,240 C 850,160 950,280 1150,180" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-line-reverse" d="M 50,100 C 300,160 500,60 750,140 C 1000,220 1080,90 1160,110" fill="none" stroke="#10b981" stroke-width="1.8" />
  </g>

  <!-- Animated Floating Data Node Badges (in safe non-overlapping background slots) -->
  <g class="particle-1" opacity="0.6">
    <circle cx="140" cy="80" r="5" fill="#00d2ff" filter="url(#softGlow)" />
    <circle cx="1060" cy="90" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="980" cy="290" r="4.5" fill="#10b981" filter="url(#softGlow)" />
  </g>

  <g class="particle-2" opacity="0.65">
    <circle cx="1110" cy="260" r="7" fill="#6366f1" filter="url(#softGlow)" />
    <circle cx="90" cy="240" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="300" cy="45" r="5" fill="#06b6d4" filter="url(#softGlow)" />
  </g>

  <g class="particle-3" opacity="0.5">
    <circle cx="890" cy="65" r="5.5" fill="#10b981" filter="url(#softGlow)" />
    <circle cx="70" cy="170" r="3.5" fill="#a855f7" filter="url(#softGlow)" />
  </g>

  <!-- Side Tech Deco: Micro K8s Constellation Wheel (Far Right, doesn't clash with text) -->
  <g transform="translate(1040, 180)" opacity="0.8">
    <circle cx="0" cy="0" r="75" fill="none" stroke="#326ce5" stroke-width="1.5" stroke-dasharray="6 8" class="flow-line" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 5" class="flow-line-reverse" />
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#00d2ff" stroke-width="2" />
    <!-- Mini Helm Spokes -->
    <path d="M 0,-18 L 0,18 M -18,0 L 18,0 M -13,-13 L 13,13 M -13,13 L 13,-13" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="0" r="7" fill="#326ce5" />
    <!-- Satellites -->
    <circle cx="0" cy="-75" r="6" fill="#00d2ff" filter="url(#softGlow)" />
    <circle cx="65" cy="38" r="5" fill="#10b981" filter="url(#softGlow)" />
    <circle cx="-65" cy="38" r="5" fill="#6366f1" filter="url(#softGlow)" />
  </g>

  <!-- Decorative Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 30,55 L 30,30 L 55,30" />
    <path d="M 1170,55 L 1170,30 L 1145,30" />
    <path d="M 30,305 L 30,330 L 55,330" />
    <path d="M 1170,305 L 1170,330 L 1145,330" />
  </g>

  <!-- FOREGROUND TEXT (Crystal clear, unobstructed, high contrast) -->
  <g transform="translate(100, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="375" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" class="tagline">⚡ CURATED ECOSYSTEM &amp; RADAR</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" class="title">
        Awesome <tspan fill="url(#primaryGrad)">Lightweight Kubernetes</tspan> ☸️
      </text>
    </g>

    <!-- Subtitle / Value Proposition -->
    <g transform="translate(0, 205)">
      <text x="0" y="0" class="subtitle">
        Top Minimal K8s Distributions, Edge Computing &amp; IoT Container Orchestration
      </text>
    </g>

    <!-- Key Attributes Chips -->
    <g transform="translate(0, 255)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="145" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#38bdf8">📦 Single-Binary K8s</text>

      <!-- Chip 2 -->
      <rect x="155" y="0" width="155" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="169" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#34d399">🌐 Edge &amp; IoT Ready</text>

      <!-- Chip 3 -->
      <rect x="320" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="334" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#a78bfa">⚡ Low RAM &amp; CPU</text>

      <!-- Chip 4 -->
      <rect x="495" y="0" width="160" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="509" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#fbbf24">☁️ Managed SaaS &amp; OSS</text>
    </g>
  </g>
</svg>
