<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f24"/><stop offset="50%" stop-color="#0d1b3e"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#326CE5"/><stop offset="50%" stop-color="#00D2FF"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="edgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes floatParticle1{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-18px) translateX(12px)}}@keyframes floatParticle2{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(16px) translateX(-14px)}}.subtitle,.tagline,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.title{font-weight:900;font-size:52px;fill:#fff;letter-spacing:-1px}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8;letter-spacing:.5px}.tagline{font-weight:600;font-size:15px;fill:#38bdf8;letter-spacing:2px;text-transform:uppercase}.bg-pulse-1{animation:pulseGlow 7s ease-in-out infinite;transform-origin:200px 100px}.bg-pulse-2{animation:pulseGlow 9s ease-in-out infinite 2s;transform-origin:1050px 240px}.flow-line{stroke-dasharray:8 14;animation:waveDash 10s linear infinite}.flow-line-reverse{stroke-dasharray:6 12;animation:waveDash 14s linear infinite reverse}.particle-1{animation:floatParticle1 6s ease-in-out infinite}.particle-2{animation:floatParticle2 8s ease-in-out infinite 1s}.particle-3{animation:floatParticle1 7s ease-in-out infinite 2.5s}</style><rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/><rect width="1198" height="358" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="15"/><g stroke="#38bdf8" stroke-width="1" opacity=".08"><line x1="100" x2="100" y1="0" y2="360"/><line x1="250" x2="250" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="550" x2="550" y1="0" y2="360"/><line x1="700" x2="700" y1="0" y2="360"/><line x1="850" x2="850" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"/><line x1="1150" x2="1150" y1="0" y2="360"/><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/></g><circle cx="220" cy="120" r="160" fill="#326ce5" class="bg-pulse-1" filter="url(#glow)" opacity=".22"/><circle cx="1020" cy="220" r="180" fill="#00d2ff" class="bg-pulse-2" filter="url(#glow)" opacity=".18"/><circle cx="600" cy="180" r="130" fill="#10b981" filter="url(#glow)" opacity=".12"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 50,300 C 250,220 350,320 600,240 C 850,160 950,280 1150,180" class="flow-line"/><path fill="none" stroke="#10b981" stroke-width="1.8" d="M 50,100 C 300,160 500,60 750,140 C 1000,220 1080,90 1160,110" class="flow-line-reverse"/></g><g class="particle-1" opacity=".6"><circle cx="140" cy="80" r="5" fill="#00d2ff" filter="url(#softGlow)"/><circle cx="1060" cy="90" r="6" fill="#38bdf8" filter="url(#softGlow)"/><circle cx="980" cy="290" r="4.5" fill="#10b981" filter="url(#softGlow)"/></g><g class="particle-2" opacity=".65"><circle cx="1110" cy="260" r="7" fill="#6366f1" filter="url(#softGlow)"/><circle cx="90" cy="240" r="4" fill="#38bdf8" filter="url(#softGlow)"/><circ